name: Apply session peer-id fix
on:
  push:
    branches: [main]
jobs:
  apply:
    if: >-
      github.event.head_commit.message == 'chore: trigger session peer-id fix'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply patch
        run: python .github/scripts/fix-session-peer-id.py
      - name: Build
        run: npm run build
      - name: Commit changes
        run: |
          rm -f .github/scripts/fix-session-peer-id.py
          rm -f .github/workflows/apply-session-peer-id-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: use stable logical player IDs for reconnect"
          git push
