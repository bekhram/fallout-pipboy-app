name: Apply TURN fallback

on:
  push:
    branches: [main]
    paths:
      - '.github/turn-fallback-trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply patch
        run: python3 .github/patches/apply-turn-fallback.py
      - name: Build
        run: npm run build
      - name: Commit changes
        run: |
          rm -f .github/workflows/apply-turn-fallback.yml .github/patches/apply-turn-fallback.py .github/turn-fallback-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: add TURN relay fallback for shared sessions'
          git push origin HEAD:main
