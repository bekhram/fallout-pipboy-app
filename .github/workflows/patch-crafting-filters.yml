name: Patch Crafting Filters
on:
  push:
    paths:
      - .github/workflows/patch-crafting-filters.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove duplicate helper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/components/crafting/CraftingScreen.jsx")
          text = path.read_text()
          block = '''function recipeModType(recipe) {
            const bench = String(recipe?.workbench || "").toLowerCase();
            if (["weapons", "armor", "power_armor", "robot"].includes(bench)) return bench;
            return null;
          }

          '''
          # The source block has no leading indentation; normalize the string before matching.
          block = "\n".join(line[10:] if line.startswith("          ") else line for line in block.splitlines()) + "\n"
          while text.count(block) > 1:
              text = text.replace(block + block, block, 1)
          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/crafting/CraftingScreen.jsx
          git commit -m "fix: remove duplicate crafting filter helper"
          git push origin HEAD:main
