name: Patch Crafting Filters
on:
  push:
    paths:
      - .github/workflows/patch-crafting-filters.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch crafting filters
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/crafting/CraftingScreen.jsx
          git commit -m "fix: finalize crafting recipe filters"
          git push origin HEAD:main
