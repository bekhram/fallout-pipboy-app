name: Apply Wanderer origins and ammo

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-wanderer-origins-ammo.py'
      - 'scripts/fix-wanderer-patch.py'
      - '.github/workflows/apply-wanderer-origins-ammo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply source changes
        run: |
          python scripts/apply-wanderer-origins-ammo.py
          python scripts/fix-wanderer-patch.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src public/Ammo.csv
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'feat: add Wanderer origins and correct ammo spending'
          git push
