name: Apply GM session foundation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: trigger GM session foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply GM session source patch
        run: python3 .github/scripts/apply_gm_session_foundation.py

      - name: Add PeerJS client
        run: npm install peerjs@1.5.5 --save

      - name: Build
        run: npm run build

      - name: Commit changes
        run: |
          rm -f .github/scripts/apply_gm_session_foundation.py
          rm -f .github/workflows/apply-gm-session-foundation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: add GM shared session foundation"
          git push origin main
