name: Restore armor stat editing

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-armor-stat-editing.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Restore editable armor resistance and HP fields
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/armor/ArmorScreen.jsx')
          text = path.read_text()
          old1 = '    if (powerArmorStats || field === "hp") return;'
          new1 = '    if (powerArmorStats) return;'
          old2 = '                      const canAdjust = !powerArmorStats && field.key !== "hp";'
          new2 = '                      const canAdjust = !powerArmorStats;'
          if old1 not in text:
              raise SystemExit('setResistance guard not found')
          if old2 not in text:
              raise SystemExit('canAdjust guard not found')
          text = text.replace(old1, new1, 1).replace(old2, new2, 1)
          path.write_text(text)
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit application patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/armor/ArmorScreen.jsx
          git commit -m "fix: restore editable armor resistances and hp"
          git push origin main
