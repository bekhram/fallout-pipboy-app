name: Apply weapon card d6 update

on:
  push:
    paths:
      - ".github/workflows/apply-weapon-card-d6.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply weapon card patch
        run: node scripts/patch-weapon-card-d6.mjs

      - name: Write final combat d6 asset
        run: node scripts/write-combat-d6.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit application update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/weapons/WeaponCard.jsx src/styles/screens/weapons.css public/combat-d6.png
          if git diff --cached --quiet; then
            echo "No application changes to commit."
            exit 0
          fi
          git commit -m "feat: simplify weapon cards and add combat d6"
          git push origin main
