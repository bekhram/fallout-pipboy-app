name: Apply official encounter cycle patch

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-official-encounter-cycle.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source patch
        run: python3 scripts/apply-official-encounter-cycle.py
      - name: Install dependencies
        run: npm ci
      - name: Verify build
        run: npm run build
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "Integrate official encounter lifecycle"
          git push
