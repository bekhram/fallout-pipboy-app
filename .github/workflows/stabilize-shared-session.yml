name: Stabilize shared session

on:
  push:
    paths:
      - '.github/workflows/stabilize-shared-session.yml'
      - '.github/session-stability-trigger'
      - '.github/scripts/stabilize_session.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply stability patch
        run: python3 .github/scripts/stabilize_session.py
      - name: Build
        run: npm run build
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/stabilize-shared-session.yml
          git rm -f .github/scripts/stabilize_session.py
          rm -f .github/session-stability-trigger
          git add -A
          git commit -m 'fix: stabilize shared GM sessions'
          git push origin main
