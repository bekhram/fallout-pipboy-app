name: Apply crafting perk requirements

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-crafting-perk-requirements.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: node scripts/patch-crafting-perk-requirements.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit application patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/craftingEngine.js src/data/baseCraftingRecipes.js src/components/crafting/CraftingScreen.jsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: enforce crafting perk ranks and rare recipe learning"
          git push origin main
