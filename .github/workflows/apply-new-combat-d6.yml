name: Replace combat d6 asset

on:
  push:
    paths:
      - ".github/workflows/apply-new-combat-d6.yml"

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Write new combat d6 asset
        run: |
          mkdir -p public
          printf '%s' '' | base64 -d > public/combat-d6.png
          file public/combat-d6.png

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit asset replacement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/combat-d6.png
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "ui: replace combat d6 asset"
          git push origin main
