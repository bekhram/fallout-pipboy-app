name: Core preview checks
on:
  pull_request:
    paths:
      - 'src/components/settlement/**'
      - 'src/components/session/**'
      - 'src/components/gm/**'
      - 'src/components/characterCreation/**'
      - 'src/components/map/**'
      - 'src/hooks/useSharedSession.js'
      - 'src/utils/settlement*.js'
      - 'src/utils/localSettlements.js'
      - 'src/utils/characterCreationRules.js'
      - 'src/locales/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/settlement-preview-checks.yml'
permissions:
  contents: read
concurrency:
  group: core-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:i18n
      - run: npm run test:regression
      - run: npm run build
