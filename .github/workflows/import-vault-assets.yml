name: Import Vault Tunnels Assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-vault-assets.yml"

permissions:
  contents: write

jobs:
  import-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and extract Vault Tunnels assets
        run: |
          set -euo pipefail
          rm -rf public/assets/battlemap/vault
          curl -L --fail --retry 3             "https://cdn.creativeclaw.co/u/e2d59740/zips/0121f5db-201c-4ce7-bbee-dbfa583645d0.zip"             -o /tmp/vault_tunnels_assets_v1.zip
          unzip -q -o /tmp/vault_tunnels_assets_v1.zip -d .
          test -f public/assets/battlemap/vault/rooms/atrium_vault_entrance.webp
          test -f public/assets/battlemap/vault/corridors/corridor_straight.webp
          test -f public/assets/battlemap/vault/ruined/ruined_medbay.webp

      - name: Commit production assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/battlemap/vault
          git rm .github/workflows/import-vault-assets.yml
          git commit -m "assets: add Vault Tunnels production tiles"
          git push origin HEAD:main
