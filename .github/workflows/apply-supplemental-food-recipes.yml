name: Apply supplemental food and cooking recipes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-supplemental-food-recipes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch supplemental food and cooking recipes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          food_path = Path('src/data/inventory/food.js')
          text = food_path.read_text()
          items = [
            ["Angler Meat","6","-","1d6","1","60","2"],
            ["Cave Cricket Meat","4","-","1d6","<1","18","1"],
            ["Cazador Egg","6","-","1d6","<1","35","2"],
            ["Cazador Omelet","8","Immunity to poison until the end of the scene.","-","<1","50","3"],
            ["Crispy Cave Cricket","6","May re-roll 1d20 on all AGI tests until the end of the scene.","-","<1","25","2"],
            ["Gecko Kebab","7","-","-","<1","20","1"],
            ["Gecko Meat","5","-","1d6","<1","12","1"],
            ["Giant Ant Meat","4","-","1d6","<1","3","0"],
            ["Giant Mantis Foreleg","6","-","1d6","<1","30","2"],
            ["Grilled Giant Mantis","8","May re-roll 1d20 on any Sneak test until the end of the scene.","-","<1","50","2"],
            ["Gulper Innards","3","-","1d6","1","5","2"],
            ["Gulper Slurry","10","+1 Energy damage resistance until the end of the next scene.","-","1","45","2"],
            ["Hermit Crab Meat","8","-","1d6","1","0","3"],
            ["Hermit Crab Steak","10","Double your carrying capacity until the end of the scene.","1d6","1","0","4"],
            ["Honey","5","Honey can be added to any dish to sweeten the meal. The food item gains +1 AP limit until the end of the following scene.","-","<1","20","3"],
            ["Honey Cake","12","+3 Radiation damage resistance until the end of the next scene.","-","1","80","4"],
            ["Honeycomb","6","-","-","<1","30","3"],
            ["Lamb Chops","10","Increase your melee bonus by +1 until the end of the scene.","1d6","1","100","4"],
            ["Lure Weed","2","-","1d6","<1","5","1"],
            ["Mega Sloth Meat","7","-","1d6","1","80","3"],
            ["Mega Sloth Mushroom","4","-","1d6","<1","40","2"],
            ["Mega Sloth Steak","10","+2 Physical and Energy damage resistance until the end of the scene.","-","1","110","4"],
            ["Mega Sloth Mushroom Soup","6","Until the end of the next scene, the target takes an additional 2 CD damage when you score a critical hit.","1d6","1","60","3"],
            ["Mongrel Ribs","7","Until the end of the scene, you may see in complete darkness; dim lighting and darkness no longer impose difficulty to you.","1d6","<1","30","2"],
            ["Mutton Meat Pie","15","Increase your melee bonus by +1 until the end of the next scene.","1d6","1","120","4"],
            ["Poached Angler","10","Suffer no difficulty increase for attacks and movements made underwater until the end of the scene.","-","1","100","4"],
            ["Radrat Meat","4","-","2d6","<1","4","0"],
            ["Roasted Radrat","7","+1 AP to group pool until the end of the scene.","-","<1","10","1"],
            ["Scorchbeast Meat","9","-","2d6","1","100","4"],
            ["Scorchbeast Steak","14","Regain 1 Luck point.","-","1","120","4"],
            ["Scorchbeast Stew","12","+3 Radiation damage resistance until the end of the next scene.","-","1","130","4"],
            ["Sheepsquatch Meat","8","-","1d6","1","120","4"],
            ["Snallygaster Innards","3","-","2d6","1","30","3"],
            ["Snallygaster Stew","9","+2 Poison damage resistance until the end of the next scene.","-","1","80","4"],
          ]
          missing = [row for row in items if f'\"{row[0]}\"' not in text]
          if missing:
            payload = ',' + ','.join(json.dumps(row, ensure_ascii=False, separators=(',', ':')) for row in missing)
            idx = text.rfind('];')
            if idx < 0:
              raise SystemExit('food.js array terminator not found')
            text = text[:idx] + payload + text[idx:]
            food_path.write_text(text)

          craft_path = Path('src/data/craftingRecipes.js')
          craft = craft_path.read_text()
          rows = '''
    ["Cazador Omelet", 2, "", "Common", null, { "Cazador Egg": 2, "Purified Water": 1 }],
    ["Crispy Cave Cricket", 1, "", "Common", null, { "Cave Cricket Meat": 3 }],
    ["Gecko Kebab", 1, "", "Common", null, { "Gecko Meat": 1, "Common Materials": 1 }],
    ["Grilled Giant Mantis", 1, "", "Common", null, { "Giant Mantis Foreleg": 2, "Honey": 1 }],
    ["Gulper Slurry", 4, "", "Rare", null, { "Dirty Water": 1, "Gourd": 1, "Gulper Innards": 1, "Razorgrain": 1 }],
    ["Hermit Crab Steak", 1, "", "Uncommon", null, { "Hermit Crab Meat": 1 }],
    ["Honey", 1, "", "Uncommon", null, { "Honeycomb": 1 }],
    ["Honey Cake", 4, "", "Rare", null, { "Honey": 1, "Honeycomb": 1, "Razorgrain": 1, "Mirelurk Egg": 2 }],
    ["Lamb Chops", 1, "", "Rare", null, { "Sheepsquatch Meat": 1 }],
    ["Mega Sloth Steak", 1, "", "Uncommon", null, { "Mega Sloth Meat": 1 }],
    ["Mega Sloth Mushroom Soup", 2, "", "Uncommon", null, { "Dirty Water": 1, "Mega Sloth Mushroom": 1 }],
    ["Mongrel Ribs", 2, "", "Uncommon", null, { "Mongrel Dog Meat": 1, "Lure Weed": 1 }],
    ["Mutton Meat Pie", 4, "", "Rare", null, { "Sheepsquatch Meat": 2, "Razorgrain": 2, "Dirty Water": 1, "Carrot": 2 }],
    ["Poached Angler", 1, "", "Common", null, { "Angler Meat": 2 }],
    ["Roasted Radrat", 1, "", "Common", null, { "Radrat Meat": 1 }],
    ["Scorchbeast Steak", 1, "", "Uncommon", null, { "Scorchbeast Meat": 1 }],
    ["Scorchbeast Stew", 4, "", "Rare", null, { "Carrot": 1, "Dirty Water": 1, "Scorchbeast Meat": 1, "Tato": 1 }],
    ["Snallygaster Stew", 3, "", "Uncommon", null, { "Dirty Water": 1, "Snallygaster Innards": 1, "Tato": 1 }],'''
          if '"Cazador Omelet", 2' not in craft:
            marker = '  ]),\n];\n\nconst AMMO_CRAFTING_ROWS = ['
            pos = craft.find(marker)
            if pos < 0:
              raise SystemExit('COOKING_RECIPES end marker not found')
            craft = craft[:pos] + rows + '\n' + craft[pos:]
            craft_path.write_text(craft)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/inventory/food.js src/data/craftingRecipes.js
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'feat: add supplemental irradiated food and recipes'
          git push
