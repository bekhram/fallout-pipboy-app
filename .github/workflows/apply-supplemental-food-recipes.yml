name: Apply supplemental food and cooking recipes

on:
  push:
    branches: [main]
    paths:
      - 'src/data/inventory/food.js'
      - '.github/workflows/apply-supplemental-food-recipes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch supplemental cooking recipes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          craft_path = Path('src/data/craftingRecipes.js')
          craft = craft_path.read_text()
          rows = '''
    ["Cazador Omelet", 2, "", "Common", null, { "Cazador Egg": 2, "Purified Water": 1 }],
    ["Crispy Cave Cricket", 1, "", "Common", null, { "Cave Cricket Meat": 3 }],
    ["Gecko Kebab", 1, "", "Common", null, { "Gecko Meat": 1, "Common Materials": 1 }],
    ["Grilled Giant Mantis", 1, "", "Common", null, { "Giant Mantis Foreleg": 2, "Honey": 1 }],
    ["Gulper Slurry", 4, "", "Rare", null, { "Dirty Water": 1, "Gourd": 1, "Gulper Innards": 1, "Razorgrain": 1 }],
    ["Hermit Crab Steak", 1, "", "Uncommon", null, { "Hermit Crab Meat": 1 }],
    ["Honey", 1, "", "Uncommon", null, { "Honeycomb": 1 }],
    ["Honey Cake", 4, "", "Rare", null, { "Honey": 1, "Honeycomb": 1, "Razorgrain": 1, "Mirelurk Egg": 2 }],
    ["Lamb Chops", 1, "", "Rare", null, { "Sheepsquatch Meat": 1 }],
    ["Mega Sloth Steak", 1, "", "Uncommon", null, { "Mega Sloth Meat": 1 }],
    ["Mega Sloth Mushroom Soup", 2, "", "Uncommon", null, { "Dirty Water": 1, "Mega Sloth Mushroom": 1 }],
    ["Mongrel Ribs", 2, "", "Uncommon", null, { "Mongrel Dog Meat": 1, "Lure Weed": 1 }],
    ["Mutton Meat Pie", 4, "", "Rare", null, { "Sheepsquatch Meat": 2, "Razorgrain": 2, "Dirty Water": 1, "Carrot": 2 }],
    ["Poached Angler", 1, "", "Common", null, { "Angler Meat": 2 }],
    ["Roasted Radrat", 1, "", "Common", null, { "Radrat Meat": 1 }],
    ["Scorchbeast Steak", 1, "", "Uncommon", null, { "Scorchbeast Meat": 1 }],
    ["Scorchbeast Stew", 4, "", "Rare", null, { "Carrot": 1, "Dirty Water": 1, "Scorchbeast Meat": 1, "Tato": 1 }],
    ["Snallygaster Stew", 3, "", "Uncommon", null, { "Dirty Water": 1, "Snallygaster Innards": 1, "Tato": 1 }],'''
          if '"Cazador Omelet", 2' not in craft:
            marker = '  ]),\n];\n\nconst AMMO_CRAFTING_ROWS = ['
            pos = craft.find(marker)
            if pos < 0:
              raise SystemExit('COOKING_RECIPES end marker not found')
            craft = craft[:pos] + rows + '\n' + craft[pos:]
            craft_path.write_text(craft)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/craftingRecipes.js
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'feat: add supplemental cooking recipes'
          git push
