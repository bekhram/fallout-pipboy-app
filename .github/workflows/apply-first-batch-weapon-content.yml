name: Apply first supplemental weapon batch

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/apply_first_batch_weapon_content.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patch
        run: python .github/scripts/apply_first_batch_weapon_content.py

      - name: Install dependencies
        run: npm ci

      - name: Verify build
        run: npm run build

      - name: Commit source changes
        run: |
          git config user.name "Bekhram Salimov"
          git config user.email "bahramsalimov89@gmail.com"
          git add public/weapons.csv src/data/weaponMods.js src/data/craftingRecipes.js
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "feat: add first supplemental weapon and mod batch"
          git push origin main
