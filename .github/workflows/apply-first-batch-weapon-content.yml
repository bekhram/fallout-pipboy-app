name: Apply supplemental equipment batches

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/apply_first_batch_weapon_content.py"
      - ".github/scripts/apply_settlers_guide_equipment.py"
      - ".github/scripts/apply_settlers_guide_crafting.py"
      - ".github/workflows/apply-first-batch-weapon-content.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply equipment and crafting source patches
        run: |
          python .github/scripts/apply_first_batch_weapon_content.py
          python .github/scripts/apply_settlers_guide_equipment.py
          python .github/scripts/apply_settlers_guide_crafting.py

      - name: Install dependencies
        run: npm ci

      - name: Verify build
        run: npm run build

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/weapons.csv public/Ammo.csv src/data/weaponMods.js src/data/craftingRecipes.js
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "feat: add Settler's Guide crafting and robot recipes"
          git push origin HEAD:main

# settlers-guide-crafting-trigger: 1
