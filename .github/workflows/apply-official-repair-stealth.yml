name: Apply repair and stealth rules patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-official-repair-stealth.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: node scripts/patch-official-repair-stealth.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit application patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/data/craftingRecipes.js src/components/status/StatusScreen.jsx src/components/map/LocalGmChat.jsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: align repair kit and stealth boy behavior"
          git push origin main
