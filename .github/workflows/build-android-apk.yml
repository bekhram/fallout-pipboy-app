name: Build Android APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - "public/downloads/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-main
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build signed release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Publish APK into web downloads
        shell: bash
        run: |
          set -euo pipefail
          APK_SOURCE="android/app/build/outputs/apk/release/app-release.apk"
          APK_TARGET="public/downloads/pip2d20-android.apk"
          VERSION="1.1.0"

          test -f "$APK_SOURCE"
          mkdir -p public/downloads
          cp "$APK_SOURCE" "$APK_TARGET"

          SHA256=$(sha256sum "$APK_TARGET" | awk '{print $1}')
          SIZE=$(stat -c%s "$APK_TARGET")
          BUILT_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > public/downloads/mobile-version.json <<JSON
          {
            "platform": "android",
            "version": "$VERSION",
            "versionCode": 2,
            "apk": "/downloads/pip2d20-android.apk",
            "sha256": "$SHA256",
            "size": $SIZE,
            "commit": "${GITHUB_SHA}",
            "builtAt": "$BUILT_AT"
          }
          JSON

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pip2d20-android-1.1.0
          path: public/downloads/pip2d20-android.apk
          if-no-files-found: error

      - name: Commit downloadable APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/pip2d20-android.apk public/downloads/mobile-version.json

          if git diff --cached --quiet; then
            echo "APK is already current."
            exit 0
          fi

          git commit -m "chore: publish Android APK 1.1.0"
          git push origin HEAD:main
