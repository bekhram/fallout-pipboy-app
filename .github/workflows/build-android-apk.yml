name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-main
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build signed release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK_SOURCE="android/app/build/outputs/apk/release/app-release.apk"
          mkdir -p mobile-release
          test -f "$APK_SOURCE"
          cp "$APK_SOURCE" mobile-release/pip2d20-android.apk
          sha256sum mobile-release/pip2d20-android.apk > mobile-release/pip2d20-android.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pip2d20-android-1.1.0
          path: |
            mobile-release/pip2d20-android.apk
            mobile-release/pip2d20-android.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="android-v1.1.0"
          APK="mobile-release/pip2d20-android.apk"
          CHECKSUM="mobile-release/pip2d20-android.apk.sha256"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$CHECKSUM" --clobber
            gh release edit "$TAG" \
              --title "PIP 2D20 Android 1.1.0" \
              --notes "Signed Android build generated from the current main branch."
          else
            gh release create "$TAG" "$APK" "$CHECKSUM" \
              --target "$GITHUB_SHA" \
              --title "PIP 2D20 Android 1.1.0" \
              --notes "Signed Android build generated from the current main branch."
          fi
