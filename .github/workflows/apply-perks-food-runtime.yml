name: Apply perks food runtime

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-perks-food-runtime.yml'
      - 'scripts/apply-perks-food-runtime.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply source changes
        run: python scripts/apply-perks-food-runtime.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/data/perks.js src/components/perks/PerksScreen.jsx src/utils/consumableEffects.js src/App.jsx
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'feat: enforce supplemental perks and food consumption rules'
          git push
