name: Apply shared session combat

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply shared combat patch
        run: python3 .github/scripts/apply_session_combat.py

      - name: Build
        run: npm run build

      - name: Commit changes
        run: |
          rm -f .github/scripts/apply_session_combat.py
          rm -f .github/workflows/apply-session-combat.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: add GM combat initiative controls"
          git push origin main
