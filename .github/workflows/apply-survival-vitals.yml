name: Apply survival vitals patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-survival-vitals.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patch
        run: python scripts/apply-survival-vitals.py

      - name: Install dependencies
        run: npm ci

      - name: Verify build
        run: npm run build

      - name: Commit survival mechanics
        run: |
          git config user.name "Bekhram Salimov"
          git config user.email "bahramsalimov89@gmail.com"
          git add src/hooks/useCharacterStorage.js src/constants.js src/components/map/MapScreen.jsx
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Add hunger thirst and camp survival mechanics"
          git push origin HEAD:main
