name: Apply NCR flexible creation

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_ncr_flexible_creation.py'
      - '.github/workflows/apply-ncr-flexible-creation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply NCR flexible creation logic
        run: python3 .github/scripts/apply_ncr_flexible_creation.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/characterCreation/QuickCharacterWizard.jsx
          git commit -m 'feat: add NCR flexible trait or perk choice'
          git push
