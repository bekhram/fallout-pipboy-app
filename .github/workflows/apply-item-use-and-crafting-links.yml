name: Apply item use and crafting integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-item-use-and-crafting-links.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: node scripts/patch-item-use-and-crafting-links.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit application patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/constants.js src/utils/consumableEffects.js src/components/status/StatusScreen.jsx src/components/crafting/CraftingScreen.jsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: use repair kits stealth boy and link crafted weapons"
          git push origin main
