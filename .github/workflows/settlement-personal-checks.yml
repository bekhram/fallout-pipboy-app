name: Personal construction checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'server/**'
      - 'api/**'
      - 'tests/**'
      - '.github/workflows/settlement-personal-checks.yml'
permissions:
  contents: read
concurrency:
  group: settlement-personal-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Campaign and settlement regression suites
        run: node --test tests/campaign*.test.js tests/settlement*.test.js
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Native IndexedDB regression checks
        run: python tests/browser_offline.py
      - name: Native root character hook and personal construction checks
        run: python tests/browser_personal.py
