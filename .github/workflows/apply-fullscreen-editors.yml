name: Apply fullscreen editors

on:
  push:
    paths:
      - ".github/workflows/apply-fullscreen-editors.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply fullscreen editor patch
        run: node scripts/patch-fullscreen-editors.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit application update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/weapons/WeaponsScreen.jsx src/components/inventory/InventoryScreen.jsx src/components/companion/CompanionTab.jsx src/components/companion/CompanionPresetHub.jsx src/components/companion/companion.css src/styles/components/modal.css
          if git diff --cached --quiet; then
            echo "No application changes to commit."
            exit 0
          fi
          git commit -m "ui: open item editors fullscreen"
          git push origin main
