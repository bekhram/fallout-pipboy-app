name: Apply consumable perks and result popup

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/apply_consumable_perks_popup.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patch
        run: python .github/scripts/apply_consumable_perks_popup.py

      - name: Install dependencies
        run: npm ci

      - name: Verify build
        run: npm run build

      - name: Commit source changes
        run: |
          git config user.name "Bekhram Salimov"
          git config user.email "bahramsalimov89@gmail.com"
          git add src/App.jsx src/utils/consumableEffects.js src/utils/consumableResultUi.js
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "feat: apply consumable perks and result popup"
          git push origin main
