name: Apply Ammosmith rules v2 runner

on:
  push:
    paths:
      - '.github/scripts/apply_ammosmith_rules_v2.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply source patch
        run: python .github/scripts/apply_ammosmith_rules_v2.py
      - name: Install dependencies
        run: npm ci
      - name: Verify build
        run: npm run build
      - name: Commit source changes
        run: |
          git config user.name "Bekhram Salimov"
          git config user.email "bahramsalimov89@gmail.com"
          git add public/Ammo.csv src/data/craftingRecipes.js src/components/data/perks.js src/components/data/perkTranslations.js src/components/perks/PerksScreen.jsx src/utils/craftingEngine.js src/components/crafting/CraftingScreen.jsx
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "Complete Ammosmith crafting and dismantling rules"
          git push origin main
