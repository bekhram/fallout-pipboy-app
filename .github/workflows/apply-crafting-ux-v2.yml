name: Apply Crafting UX v2

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-crafting-ux-v2.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Crafting UX patch
        run: python3 scripts/apply-crafting-ux-v2.py
      - name: Install dependencies
        run: npm ci
      - name: Verify build
        run: npm run build
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/crafting/CraftingScreen.jsx src/App.jsx
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "Improve Crafting menu UX and migrate materials to Junk"
          git push
