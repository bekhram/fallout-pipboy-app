name: Apply ammo craft quantity

on:
  push:
    paths:
      - '.github/scripts/apply_ammo_craft_quantity.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply source patch
        run: python .github/scripts/apply_ammo_craft_quantity.py

      - name: Install dependencies
        run: npm ci

      - name: Verify build
        run: npm run build

      - name: Commit source changes
        run: |
          git config user.name "Bekhram Salimov"
          git config user.email "bahramsalimov89@gmail.com"
          git add src/data/craftingRecipes.js src/utils/craftingEngine.js
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "Use ammo quantity table for Ammosmith crafting"
            git push origin main
          fi
