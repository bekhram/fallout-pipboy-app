name: Apply combat calculations
on:
  push:
    paths:
      - '.github/workflows/apply-combat-calculations.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch calculations
        run: echo '...' | base64 -d > /tmp/patch.py && python3 /tmp/patch.py
      - name: Build
        run: npm ci && npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/legendaryEffects.js src/components/weapons/WeaponCard.jsx src/components/armor/ArmorScreen.jsx src/utils/dice.js src/components/dice/FalloutD6Roller.jsx
          git diff --cached --quiet || git commit -m "feat: integrate legendary effects into combat calculations"
          git push
