name: Replace Vault Tunnels Transparent Assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/replace-vault-transparent-assets.yml"

permissions:
  contents: write

jobs:
  replace-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace Vault Tunnels assets
        run: |
          set -euo pipefail
          rm -rf public/assets/battlemap/vault
          mkdir -p /tmp/vault-transparent
          curl -L --fail --retry 3             "https://cdn.creativeclaw.co/u/e2d59740/zips/82421b56-1e46-433d-820b-f7f30b2f6c30.zip"             -o /tmp/vault_assets_transparent_v2.zip
          unzip -q -o /tmp/vault_assets_transparent_v2.zip -d /tmp/vault-transparent
          mkdir -p public/assets/battlemap/vault
          cp -R /tmp/vault-transparent/rooms public/assets/battlemap/vault/
          cp -R /tmp/vault-transparent/ruined public/assets/battlemap/vault/
          cp -R /tmp/vault-transparent/corridors public/assets/battlemap/vault/
          test -f public/assets/battlemap/vault/rooms/atrium_vault_entrance.png
          test -f public/assets/battlemap/vault/rooms/medbay.png
          test -f public/assets/battlemap/vault/ruined/ruined_medbay.png
          test -f public/assets/battlemap/vault/corridors/corridor_straight_horizontal.png

      - name: Commit transparent production assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/battlemap/vault
          git rm .github/workflows/replace-vault-transparent-assets.yml
          git commit -m "assets: replace Vault Tunnels with transparent normalized tiles"
          git push origin HEAD:main
