name: Apply player chat drawer

on:
  push:
    paths:
      - '.github/workflows/apply-player-chat-drawer.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply player chat drawer patch
        run: python3 .github/scripts/apply_player_chat_drawer.py
      - name: Build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-player-chat-drawer.yml .github/scripts/apply_player_chat_drawer.py
          git add src/App.jsx src/components/session/session.css
          git commit -m "ui: return players to sheet with group chat drawer"
          git push
