name: Apply travel encounter resolution fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-travel-encounter-resolution-fix.yml
      - scripts/apply-travel-encounter-resolution-fix.py
      - src/utils/travelEncounterResolution.js

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patch
        run: python3 scripts/apply-travel-encounter-resolution-fix.py

      - name: Install dependencies
        run: npm install

      - name: Verify build
        run: npm run build

      - name: Commit fix
        run: |
          git config user.name "Bekhram Salimov"
          git config user.email "bahramsalimov89@gmail.com"
          git add src/components/map/MapScreen.jsx src/components/map/LocalGmChat.jsx src/hooks/useCharacterStorage.js api/auto-gm.js
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Fix travel encounter handoff and exact consequences"
          git push origin main
