name: Apply full equipment localization
on:
  push:
    paths:
      - '.github/workflows/apply-full-equipment-localization.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch UI localization and legendary outfit support
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, required=True):
              p=Path(path); s=p.read_text()
              if old not in s:
                  if required: raise SystemExit(f'missing pattern in {path}: {old[:80]}')
                  return
              p.write_text(s.replace(old,new))

          # Clothing / outfits with All or multiple locations can be legendary.
          p=Path('src/data/legendaryProperties.js'); s=p.read_text()
          if 'getLegendaryArmorPropertiesForLocations' not in s:
              s += '''\nexport function getLegendaryArmorPropertiesForLocations(value) {\n  const source = String(value || "").toLowerCase();\n  let locations = [];\n  if (source.includes("all")) locations = ["Head", "Arm", "Torso", "Leg"];\n  else {\n    if (source.includes("head")) locations.push("Head");\n    if (source.includes("arm")) locations.push("Arm");\n    if (source.includes("torso") || source.includes("chest")) locations.push("Torso");\n    if (source.includes("leg")) locations.push("Leg");\n  }\n  const seen = new Set();\n  return locations.flatMap((location) => getLegendaryArmorProperties(location)).filter((property) => !seen.has(property.id) && seen.add(property.id));\n}\n'''
              p.write_text(s)

          replace('src/components/shared/LegendaryPropertyEditor.jsx',
            '  normalizeArmorLocation,\n} from "../../data/legendaryProperties.js";',
            '  normalizeArmorLocation,\n  getLegendaryArmorPropertiesForLocations,\n} from "../../data/legendaryProperties.js";\nimport { localizeLegendaryName } from "../../data/equipmentLocalizationSupplemental.js";')
          replace('src/components/shared/LegendaryPropertyEditor.jsx',
            '  const normalizedLocation = normalizeArmorLocation(armorLocation || draft?.armorLocations || draft?.location);\n  const allowed = isArmor ? Boolean(normalizedLocation) : canWeaponBeLegendary(draft);\n  const options = isArmor\n    ? getLegendaryArmorProperties(normalizedLocation)\n    : getLegendaryWeaponProperties(draft);',
            '  const armorLocationValue = armorLocation || draft?.armorLocations || draft?.location;\n  const normalizedLocation = normalizeArmorLocation(armorLocationValue);\n  const armorOptions = getLegendaryArmorPropertiesForLocations(armorLocationValue);\n  const allowed = isArmor ? armorOptions.length > 0 : canWeaponBeLegendary(draft);\n  const options = isArmor ? armorOptions : getLegendaryWeaponProperties(draft);')
          replace('src/components/shared/LegendaryPropertyEditor.jsx',
            '<option key={property.id} value={property.id}>{property.name}</option>',
            '<option key={property.id} value={property.id}>{localizeLegendaryName(property.name, language)}</option>')
          replace('src/components/shared/LegendaryPropertyEditor.jsx',
            'export function LegendaryBadge({ kind, item }) {',
            'export function LegendaryBadge({ kind, item, language = "en" }) {')
          replace('src/components/shared/LegendaryPropertyEditor.jsx',
            '★ LEGENDARY{property ? ` · ${property.name}` : ""}',
            '★ LEGENDARY{property ? ` · ${localizeLegendaryName(property.name, language)}` : ""}')

          # Armor screen names + legendary option translations.
          replace('src/components/armor/ArmorScreen.jsx',
            'import { localizeArmorEffect, localizeArmorName } from "../../utils/armorLocalization.js";',
            'import { localizeArmorEffect, localizeArmorName } from "../../utils/armorLocalization.js";\nimport { localizeLegendaryName, localizeSupplementalArmorName } from "../../data/equipmentLocalizationSupplemental.js";')
          replace('src/components/armor/ArmorScreen.jsx',
            '  const armorName = (entry) => localizeArmorName(entry?.name, language);',
            '  const armorName = (entry) => { const extra = localizeSupplementalArmorName(entry?.name, language); return extra !== (entry?.name || "") ? extra : localizeArmorName(entry?.name, language); };')
          replace('src/components/armor/ArmorScreen.jsx',
            '<option key={option.id} value={option.id}>{option.name}</option>',
            '<option key={option.id} value={option.id}>{localizeLegendaryName(option.name, language)}</option>')
          replace('src/components/armor/ArmorScreen.jsx',
            '★ {legendaryProperty.name}',
            '★ {localizeLegendaryName(legendaryProperty.name, language)}', required=False)

          # Weapon names and newly added mod names.
          replace('src/components/weapons/WeaponCard.jsx',
            'import { localizeWeaponModName } from "../../utils/weaponModLocalization.js";',
            'import { localizeWeaponModName } from "../../utils/weaponModLocalization.js";\nimport { localizeSupplementalWeaponName, localizeSupplementalModName } from "../../data/equipmentLocalizationSupplemental.js";')
          replace('src/components/weapons/WeaponCard.jsx',
            '<h3>{weapon.name || t("weapons.unnamedWeapon")}</h3>',
            '<h3>{localizeSupplementalWeaponName(weapon.name, language) || weapon.name || t("weapons.unnamedWeapon")}</h3>')
          replace('src/components/weapons/WeaponCard.jsx',
            'localizeWeaponModName(modName, i18n.resolvedLanguage)',
            '(localizeSupplementalModName(modName, i18n.resolvedLanguage) !== modName ? localizeSupplementalModName(modName, i18n.resolvedLanguage) : localizeWeaponModName(modName, i18n.resolvedLanguage))', required=False)

          replace('src/components/weapons/WeaponEditor.jsx',
            'import { localizeWeaponModEffect, localizeWeaponModName, localizeWeaponModRequirement } from "../../utils/weaponModLocalization.js";',
            'import { localizeWeaponModEffect, localizeWeaponModName, localizeWeaponModRequirement } from "../../utils/weaponModLocalization.js";\nimport { localizeSupplementalWeaponName, localizeSupplementalModName } from "../../data/equipmentLocalizationSupplemental.js";')
          replace('src/components/weapons/WeaponEditor.jsx',
            "{gw.name} (DMG: {gw['Damage Rating']} CD, FR: {gw['Rate of Fire']})",
            "{localizeSupplementalWeaponName(gw.name, i18n.resolvedLanguage)} (DMG: {gw['Damage Rating']} CD, FR: {gw['Rate of Fire']})")
          replace('src/components/weapons/WeaponEditor.jsx',
            '{localizeWeaponModName(item.name, i18n.resolvedLanguage)}',
            '{localizeSupplementalModName(item.name, i18n.resolvedLanguage) !== item.name ? localizeSupplementalModName(item.name, i18n.resolvedLanguage) : localizeWeaponModName(item.name, i18n.resolvedLanguage)}')

          # Inventory archive translations.
          replace('src/data/inventoryLocalizationExtended.js',
            'import { WEAPON_NAMES, WEAPON_TERMS } from "./inventoryLocalization/weapons.js";',
            'import { WEAPON_NAMES, WEAPON_TERMS } from "./inventoryLocalization/weapons.js";\nimport { localizeSupplementalWeaponName, localizeSupplementalArmorName } from "./equipmentLocalizationSupplemental.js";')
          replace('src/data/inventoryLocalizationExtended.js',
            '      displayName: pick3(WEAPON_NAMES[originalName], lang) || originalName,',
            '      displayName: pick3(WEAPON_NAMES[originalName], lang) || localizeSupplementalWeaponName(originalName, lang) || originalName,')
          replace('src/data/inventoryLocalizationExtended.js',
            '      displayName: translateArmorName(originalName, lang),',
            '      displayName: localizeSupplementalArmorName(originalName, lang) !== originalName ? localizeSupplementalArmorName(originalName, lang) : translateArmorName(originalName, lang),')

          # Power armor additions.
          p=Path('src/components/armor/PowerArmorPanel.jsx'); s=p.read_text()
          s=s.replace('ru: { raider:', 'ru: { excavator: "Силовая броня Экскаватор", hellcat: "Силовая броня Hellcat", t65: "Силовая броня T-65", raider:')
          s=s.replace('uk: { raider:', 'uk: { excavator: "Силова броня Екскаватор", hellcat: "Силова броня Hellcat", t65: "Силова броня T-65", raider:')
          s=s.replace('pl: { raider:', 'pl: { excavator: "Pancerz wspomagany Excavator", hellcat: "Pancerz wspomagany Hellcat", t65: "Pancerz wspomagany T-65", raider:')
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: localize equipment and legendary properties"
          git push
