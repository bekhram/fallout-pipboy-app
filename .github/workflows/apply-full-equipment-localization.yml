function langCode(language) {
  const code = String(language || "en").toLowerCase().split("-")[0];
  return ["ru","uk","pl"].includes(code) ? code : "en";
}

export function localizeLegendaryProperty(property, language = "en") {
  if (!property) return null;
  const lang = langCode(language);
  if (lang === "en") return property;
  return {
    ...property,
    name: NAME[lang]?.[property.name] || property.name,
    description: DESC[lang]?.[property.name] || property.description,
  };
}
