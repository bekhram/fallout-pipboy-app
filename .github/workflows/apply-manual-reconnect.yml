name: Apply manual reconnect

on:
  push:
    paths:
      - '.github/manual-reconnect-trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply patch
        run: python3 .github/apply_manual_reconnect.py
      - name: Build
        run: npm run build
      - name: Commit changes
        run: |
          rm -f .github/apply_manual_reconnect.py
          rm -f .github/manual-reconnect-trigger
          rm -f .github/workflows/apply-manual-reconnect.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add manual session reconnect" || exit 0
          git push
