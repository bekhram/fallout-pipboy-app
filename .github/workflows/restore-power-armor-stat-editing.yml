name: Restore power armor stat editing

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-power-armor-stat-editing.yml
      - scripts/patch-power-armor-editing.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: node scripts/patch-power-armor-editing.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit application patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/armor/ArmorScreen.jsx src/data/powerArmor.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: allow editing power armor resistances and hp"
          git push origin main
