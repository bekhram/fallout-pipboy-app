name: Apply NPC HP editor

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-npc-hp-editor.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply patch
        run: python .github/scripts/apply_npc_hp_editor.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit source changes
        run: |
          rm -f .github/scripts/apply_npc_hp_editor.py
          rm -f .github/workflows/apply-npc-hp-editor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks/useSharedSession.js src/components/session/SessionCombatBoard.jsx src/components/session/session.css .github/scripts/apply_npc_hp_editor.py .github/workflows/apply-npc-hp-editor.yml
          git commit -m "feat: edit NPC current and max HP in GM combat"
          git push
