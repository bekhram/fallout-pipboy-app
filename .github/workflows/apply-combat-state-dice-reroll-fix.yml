name: Apply combat state and dice reroll fix

on:
  push:
    paths:
      - '.github/scripts/apply_combat_state_dice_reroll_fix.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply source patch
        run: python3 .github/scripts/apply_combat_state_dice_reroll_fix.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/components/weapons/WeaponsScreen.jsx src/components/weapons/WeaponCard.jsx src/components/dice/DiceRollModal.jsx src/components/dice/FalloutD20Roller.jsx src/components/dice/FalloutD6Roller.jsx
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "feat: add combat resources and fix d20 reroll damage"
          git push origin main
