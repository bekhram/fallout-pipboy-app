name: Apply lore chat patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-lore-chat.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patch
        run: python3 scripts/apply_lore_chat.py

      - name: Install dependencies
        run: npm ci

      - name: Verify build
        run: npm run build

      - name: Commit lore chat UX
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Bekhram Salimov"
          git config user.email "bahramsalimov89@gmail.com"
          git rm .github/workflows/apply-lore-chat.yml scripts/apply_lore_chat.py
          git add src/components/map/LocalGmChat.jsx src/components/map/localGmChat.css src/components/layout/PipboyShell.jsx
          git commit -m "Move location lore help into Auto GM chat"
          git push origin HEAD:main
