name: Apply lore chat patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-lore-chat.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move location lore into Auto GM chat
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Missing patch anchor: {label}")
              return text.replace(old, new, 1)

          chat_path = Path("src/components/map/LocalGmChat.jsx")
          chat = chat_path.read_text()

          chat = replace_once(
              chat,
              'import { getMapLanguageCode, mapUiText } from "./mapUiText.js";\n',
              'import { getMapLanguageCode, mapUiText } from "./mapUiText.js";\nimport { getLocationWikiMeta } from "../../data/map/locationLore.js";\n',
              "lore meta import",
          )

          check_block = '''const CHECK_TEXT = {
  en: { check: "SKILL CHECK", tap: "TAP TO ROLL", rolling: "ROLLING...", target: "TARGET", difficulty: "DIFFICULTY", successes: "successes", complications: "complications", success: "SUCCESS", failure: "FAILURE" },
  ru: { check: "ПРОВЕРКА НАВЫКА", tap: "НАЖМИТЕ, ЧТОБЫ БРОСИТЬ", rolling: "БРОСОК...", target: "ЦЕЛЬ", difficulty: "СЛОЖНОСТЬ", successes: "успехов", complications: "осложнений", success: "УСПЕХ", failure: "НЕУДАЧА" },
  uk: { check: "ПЕРЕВІРКА НАВИЧКИ", tap: "НАТИСНІТЬ, ЩОБ КИНУТИ", rolling: "КИДОК...", target: "ЦІЛЬ", difficulty: "СКЛАДНІСТЬ", successes: "успіхів", complications: "ускладнень", success: "УСПІХ", failure: "НЕВДАЧА" },
  pl: { check: "TEST UMIEJĘTNOŚCI", tap: "DOTKNIJ, ABY RZUCIĆ", rolling: "RZUT...", target: "CEL", difficulty: "TRUDNOŚĆ", successes: "sukcesy", complications: "komplikacje", success: "SUKCES", failure: "PORAŻKA" },
};
'''
          lore_block = check_block + '''
const LORE_TEXT = {
  en: {
    label: (name) => `What is known about ${name}?`,
    question: (name) => `What is known about ${name} in Fallout lore?`,
  },
  ru: {
    label: (name) => `Что известно о ${name}?`,
    question: (name) => `Что известно о ${name} по лору Fallout?`,
  },
  uk: {
    label: (name) => `Що відомо про ${name}?`,
    question: (name) => `Що відомо про ${name} за лором Fallout?`,
  },
  pl: {
    label: (name) => `Co wiadomo o ${name}?`,
    question: (name) => `Co wiadomo o ${name} w lore Fallout?`,
  },
};

const LORE_REFERENCE_CACHE = new Map();
'''
          chat = replace_once(chat, check_block, lore_block, "lore chat copy")

          chat = replace_once(
              chat,
              '  const [isSending, setIsSending] = useState(false);\n',
              '  const [isSending, setIsSending] = useState(false);\n  const [isLoreLoading, setIsLoreLoading] = useState(false);\n',
              "lore loading state",
          )

          chat = replace_once(
              chat,
              '''  const isPersistentLocation = world.isStaticLocation === true;
  const currentSessionKey = useMemo(() => getSessionKey(world), [world]);''',
              '''  const isPersistentLocation = world.isStaticLocation === true;
  const loreTarget = useMemo(() => {
    if (world.currentLocation?.id) return world.currentLocation;
    if (world.trackedObjective?.id) return world.trackedObjective;
    return null;
  }, [world]);
  const currentSessionKey = useMemo(() => getSessionKey(world), [world]);''',
              "lore target",
          )

          chat = replace_once(
              chat,
              '  async function requestGm(message, history = []) {\n',
              '  async function requestGm(message, history = [], worldOverride = world) {\n',
              "request gm signature",
          )
          chat = replace_once(
              chat,
              '''        character,
        world,
        language,''',
              '''        character,
        world: worldOverride,
        language,''',
              "request world override",
          )

          chat = replace_once(
              chat,
              '''    try {
      const result = await requestGm(cleanText, previousMessages);
      setPendingCheck(result.check);''',
              '''    try {
      const requestText = String(options.requestText || cleanText).trim() || cleanText;
      const result = await requestGm(
        requestText,
        previousMessages,
        options.worldOverride || world
      );
      setPendingCheck(result.check);''',
              "send text gm request",
          )

          send_anchor = '''  async function sendMessage(event) {
    event?.preventDefault?.();
    await sendText(draft);
  }
'''
          ask_lore = '''  async function askLore() {
    if (!loreTarget || isSending || isLoreLoading || isArchiveView) return;

    const copy = LORE_TEXT[language] || LORE_TEXT.en;
    const targetName = loreTarget.name || loreTarget.id || tx("unknownLocation");
    const question = copy.question(targetName);
    const meta = getLocationWikiMeta(loreTarget);
    let reference = null;

    setIsLoreLoading(true);
    try {
      if (meta) {
        const cacheKey = `${language}:${meta.id}`;
        reference = LORE_REFERENCE_CACHE.get(cacheKey) || null;
        if (!reference) {
          try {
            const response = await fetch("/api/location-lore", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                title: meta.wikiTitle,
                locationName: targetName,
                language,
                coreLore: meta.coreLore || "",
              }),
            });
            const payload = await response.json().catch(() => ({}));
            if (response.ok && payload && typeof payload === "object") {
              reference = payload;
              LORE_REFERENCE_CACHE.set(cacheKey, payload);
            }
          } catch {
            // Core lore injected by the GM bridge remains available as a fallback.
          }
        }
      }

      const worldOverride = {
        ...world,
        loreQuestion: {
          targetLocation: loreTarget,
          reference: reference || (meta ? {
            title: targetName,
            summary: meta.coreLore || null,
            sourceLabel: "Fallout Wiki",
          } : null),
        },
      };
      const requestText = `${question}\n\nAUTO GM LORE MODE: The player is asking for setting/history information about the named location, not a quest walkthrough. Use SESSION CONTEXT.world.loreQuestion.reference as the primary reference when available, together with the supplied location lore. Answer conversationally in the selected app language. Share useful Fallout setting and historical context, but avoid future quest outcomes and hidden spoilers. Do not mention the external Wiki or source unless the player asks.`;
      await sendText(question, { requestText, worldOverride });
    } finally {
      setIsLoreLoading(false);
    }
  }

''' + send_anchor
          chat = replace_once(chat, send_anchor, ask_lore, "ask lore action")

          composer_anchor = '''          <form className="pip-local-gm__composer" onSubmit={sendMessage}>'''
          composer_with_lore = '''          {loreTarget ? (
            <div className="pip-local-gm__lore-row">
              <button
                type="button"
                className="pip-local-gm__lore-question"
                onClick={askLore}
                disabled={isSending || isLoreLoading}
              >
                <span aria-hidden="true">?</span>
                {(LORE_TEXT[language] || LORE_TEXT.en).label(
                  loreTarget.name || loreTarget.id || tx("unknownLocation")
                )}
              </button>
            </div>
          ) : null}
          <form className="pip-local-gm__composer" onSubmit={sendMessage}>'''
          chat = replace_once(chat, composer_anchor, composer_with_lore, "lore question button")
          chat_path.write_text(chat)

          css_path = Path("src/components/map/localGmChat.css")
          css = css_path.read_text()
          composer_css_anchor = '''.pip-local-gm__composer {
  display: grid;'''
          lore_css = '''.pip-local-gm__lore-row {
  display: flex;
  justify-content: flex-start;
  padding: 1px 2px 0;
}

.pip-local-gm__lore-question {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  max-width: 100%;
  padding: 4px 2px;
  border: 0;
  border-bottom: 1px dashed rgba(120, 255, 140, 0.24);
  background: transparent;
  color: var(--pip-text);
  font: inherit;
  font-size: 10px;
  letter-spacing: 0.06em;
  text-align: left;
  opacity: 0.68;
  cursor: pointer;
}

.pip-local-gm__lore-question:hover:not(:disabled),
.pip-local-gm__lore-question:focus-visible:not(:disabled) {
  border-bottom-color: rgba(120, 255, 140, 0.55);
  opacity: 0.95;
}

.pip-local-gm__lore-question:disabled {
  cursor: default;
  opacity: 0.35;
}

.pip-local-gm__lore-question span {
  display: inline-grid;
  width: 18px;
  height: 18px;
  place-items: center;
  flex: 0 0 auto;
  border: 1px solid rgba(120, 255, 140, 0.24);
  border-radius: 50%;
  font-size: 10px;
  font-weight: 800;
}

''' + composer_css_anchor
          css = replace_once(css, composer_css_anchor, lore_css, "subtle lore css")
          css_path.write_text(css)

          shell_path = Path("src/components/layout/PipboyShell.jsx")
          shell = shell_path.read_text()
          shell = shell.replace('import LocationLoreDock from "../map/LocationLoreDock.jsx";\n', '', 1)
          shell = shell.replace('        <LocationLoreDock active={activeTab === "map"} />\n', '', 1)
          shell_path.write_text(shell)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify build
        run: npm run build

      - name: Commit lore chat UX
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Bekhram Salimov"
          git config user.email "bahramsalimov89@gmail.com"
          git rm .github/workflows/apply-lore-chat.yml
          git add src/components/map/LocalGmChat.jsx src/components/map/localGmChat.css src/components/layout/PipboyShell.jsx
          git commit -m "Move location lore help into Auto GM chat"
          git push origin HEAD:main
