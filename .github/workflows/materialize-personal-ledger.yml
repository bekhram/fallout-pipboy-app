name: Materialize verified personal ledger source
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/personal-ledger-*.b64'
      - '.github/workflows/materialize-personal-ledger.yml'
permissions:
  contents: read
jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/settlement-personal-ledger'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Apply hash-verified application source only to this draft branch
        env:
          BRANCH: feat/settlement-personal-ledger
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = a180c083525a7853ead4c3d7ebee1e98bdfac7f4
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          python - <<'PY'
          import base64, hashlib, json, lzma, pathlib
          encoded = ''.join(pathlib.Path(f'.github/personal-ledger-{i}.b64').read_text() for i in (1,2))
          data = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(data).hexdigest() == '75a28f5385b72165204bb723c078c64d141e6771c81cb1a60acae6087c954ecc'
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          planned = []
          for entry in json.loads(data):
              path = pathlib.Path(entry['path'])
              assert not path.is_absolute() and '..' not in path.parts and not path.is_symlink()
              assert path.parts[0] in {'src','server','api','tests','docs'} or str(path) == '.github/workflows/settlement-personal-checks.yml'
              if entry['base'] is None:
                  assert not path.exists(), str(path)
                  old = b''
              else:
                  old = path.read_bytes()
                  assert blob(old) == entry['base'], str(path)
              text = old.decode('utf-8')
              for start,end,insert in reversed(entry['edits']):
                  assert 0 <= start <= end <= len(text)
                  text = text[:start] + insert + text[end:]
              new = text.encode('utf-8')
              assert blob(new) == entry['target'], str(path)
              planned.append((path,new))
          assert len(planned) == 30
          for path,new in planned:
              if path.parts[0] == '.github':
                  continue
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(new)
          print('Verified all 30 deltas; materialized 29 application/test/docs files. Workflow files are unchanged.')
          PY
          git add -- src server api tests docs
          test -z "$(git diff --cached --name-only -- .github)"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: atomic personal inventory reservations and shared construction storage' -m 'Apply verified local source delta. Personal construction uses the central durable character record, stable operation IDs, original-payer refunds and a warehouse for placement conflicts. Includes real-engine and browser regression tests. Draft preview only.'
          git push origin HEAD:refs/heads/$BRANCH
