name: Apply companion card dice

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-companion-card-dice.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fix patch escaping
        run: node scripts/fix-companion-patch-escapes.mjs
      - name: Apply patch
        run: node scripts/patch-companion-card-dice.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit application patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/components/layout/PipboyShell.jsx src/components/companion/CompanionPresetHub.jsx src/components/companion/CompanionTab.jsx src/components/companion/companion.css
          git diff --cached --quiet && exit 0
          git commit -m "fix: compact companion cards and use shared dice roller"
          git push origin main
