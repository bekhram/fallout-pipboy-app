name: Restore working session network

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: "github.event.head_commit.message == 'chore: restore working session network'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore last known working session transport
        shell: bash
        run: |
          git show a6df8f825412a0d000274a03003bfdfb16ecb755:src/hooks/useSharedSession.js > src/hooks/useSharedSession.js
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/hooks/useSharedSession.js')
          source = path.read_text()

          replacement = r'''  const connectPlayer = (normalized) => {
    setStatus("connecting");
    const peer = new Peer(undefined, { debug: 1 });
    peerRef.current = peer;
    peer.on("open", () => {
      const connection = peer.connect(getHostPeerId(normalized), { reliable: true });
      hostConnectionRef.current = connection;
      connection.on("open", () => {
        setError(null);
        setStatus("online");
        connection.send({ type: "join", player: makePlayerPacket(playerNameRef.current, formRef.current) });
      });
      connection.on("data", (data) => {
        if (!data || typeof data !== "object") return;
        if (data.type === "session_state") {
          setPlayers(Array.isArray(data.players) ? data.players : []);
          setSceneMessage(cleanText(data.sceneMessage, 600));
          setFeed(Array.isArray(data.feed) ? data.feed.slice(-MAX_FEED) : []);
          setCombat(sanitizeCombatState(data.combat));
        }
      });
      connection.on("close", () => setStatus("disconnected"));
      connection.on("error", () => {
        setStatus("error");
        setError({ key: "hostNotFound" });
      });
    });
    peer.on("error", (peerError) => {
      setStatus("error");
      if (peerError?.type === "peer-unavailable") setError({ key: "hostNotFound" });
      else setError({ key: "networkError", message: peerError?.message || "Network error" });
    });
  };

  const joinSession = ({ code, name }) => {
    const normalized = normalizeSessionCode(code);
    const cleanName = cleanText(name, 40);
    destroyNetwork();
    resetState();
    setError(null);
    playerNameRef.current = cleanName || "Player";
    codeRef.current = normalized;
    setSessionCode(normalized);
    setMode("player");
    connectPlayer(normalized);
  };

  const reconnectNow = () => {
    if (mode !== "player" || !codeRef.current) return false;
    destroyNetwork();
    setError(null);
    connectPlayer(codeRef.current);
    return true;
  };'''

          source, count = re.subn(
              r'  const joinSession = \(\{ code, name \}\) => \{.*?\n  \};\n\n  const exitSession =',
              replacement + '\n\n  const exitSession =',
              source,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'joinSession replacement count={count}')

          source = source.replace(
              '    joinSession,\n    exitSession,',
              '    joinSession,\n    reconnectNow,\n    exitSession,',
              1,
          )
          path.write_text(source)
          PY
          rm .github/workflows/restore-working-session-network.yml

      - name: Build
        run: npm run build

      - name: Commit restored transport
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore pre-06105fb session transport"
          git push origin main
